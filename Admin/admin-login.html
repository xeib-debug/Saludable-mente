<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Saludablemente</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="icon" type="image/png" href="../file_00000000aef871f5afb30c26ea51f4b5.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Grid animado de fondo */
    .grid-background {
      position: fixed;
      width: 100%;
      height: 100%;
      background-image: 
        linear-gradient(rgba(46, 139, 87, 0.1) 1px, transparent 1px),
        linear-gradient(90deg, rgba(46, 139, 87, 0.1) 1px, transparent 1px);
      background-size: 50px 50px;
      animation: gridMove 20s linear infinite;
      z-index: 0;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(50px, 50px); }
    }

    /* Círculos decorativos */
    .circle {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(46, 139, 87, 0.3), transparent);
      animation: float 15s infinite ease-in-out;
      z-index: 0;
    }

    .circle-1 {
      width: 400px;
      height: 400px;
      top: -200px;
      right: -100px;
      animation-delay: 0s;
    }

    .circle-2 {
      width: 300px;
      height: 300px;
      bottom: -150px;
      left: -100px;
      animation-delay: -7s;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(30px, -30px) scale(1.1); }
    }

    .login-container {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(46, 139, 87, 0.3);
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
      max-width: 380px;
      width: 100%;
      position: relative;
      z-index: 10;
      animation: slideUp 0.6s ease-out;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(50px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .security-badge {
      position: absolute;
      top: -14px;
      right: 25px;
      background: linear-gradient(135deg, #2E8B57, #68c28f);
      color: white;
      padding: 5px 14px;
      border-radius: 16px;
      font-size: 10px;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(46, 139, 87, 0.4);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .shield-icon {
      width: 65px;
      height: 65px;
      margin: 0 auto 14px;
      background: linear-gradient(135deg, #2E8B57, #1a5e3f);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 30px rgba(46, 139, 87, 0.5);
      position: relative;
    }

    .shield-icon::after {
      content: '';
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 16px;
      background: linear-gradient(135deg, #2E8B57, #1a5e3f);
      opacity: 0.5;
      animation: ripple 2s infinite;
    }

    @keyframes ripple {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }
      100% {
        transform: scale(1.3);
        opacity: 0;
      }
    }

    .login-header h1 {
      color: #f1f5f9;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 5px;
    }

    .login-header p {
      color: #94a3b8;
      font-size: 12px;
    }

    .alert {
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 12px;
      display: none;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-20px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .alert.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      display: block;
    }

    .alert.info {
      background: rgba(59, 130, 246, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(59, 130, 246, 0.3);
      display: block;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #e2e8f0;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 16px;
      z-index: 1;
    }

    .form-group input {
      width: 100%;
      padding: 11px 11px 11px 40px;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid rgba(46, 139, 87, 0.3);
      border-radius: 10px;
      font-size: 13px;
      color: #f1f5f9;
      transition: all 0.3s;
    }

    .form-group input::placeholder {
      color: #64748b;
    }

    .form-group input:focus {
      outline: none;
      border-color: #2E8B57;
      background: rgba(15, 23, 42, 1);
      box-shadow: 0 0 0 3px rgba(46, 139, 87, 0.15);
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #2E8B57, #68c28f);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 6px 24px rgba(46, 139, 87, 0.4);
      position: relative;
      overflow: hidden;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }

    .btn-login:hover::before {
      width: 400px;
      height: 400px;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 32px rgba(46, 139, 87, 0.5);
    }

    .btn-login:active {
      transform: translateY(-1px);
    }

    .btn-login:disabled {
      background: linear-gradient(135deg, #475569, #64748b);
      cursor: not-allowed;
      opacity: 0.6;
      transform: none;
    }

    .btn-volver {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: #94a3b8;
      border: 2px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.3s;
    }

    .btn-volver:hover {
      background: rgba(148, 163, 184, 0.1);
      border-color: rgba(148, 163, 184, 0.5);
      color: #cbd5e1;
    }

    .intentos-info {
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.3);
      color: #fde68a;
      padding: 9px;
      border-radius: 8px;
      font-size: 11px;
      margin-top: 14px;
      text-align: center;
      animation: shake 0.5s;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .footer-info {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      text-align: center;
      color: #64748b;
      font-size: 10px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .login-container {
        padding: 25px 20px;
      }

      .shield-icon {
        width: 58px;
        height: 58px;
        font-size: 28px;
      }

      .login-header h1 {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <h1>🔐 Acceso Administrativo</h1>
      <p>Panel de administración Saludablemente</p>
    </div>
    
    <div id="alerta-mensaje" class="alert"></div>
    
    <form onsubmit="iniciarSesionAdmin(event)">
      <div class="form-group">
        <label for="email">Email del propietario</label>
        <input 
          type="email" 
          id="email" 
          required 
          placeholder="admin@saludablemente.com"
          autocomplete="username"
        >
      </div>
      
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          required 
          placeholder="••••••••"
          autocomplete="current-password"
        >
      </div>
      
      <button type="submit" class="btn-login">Iniciar Sesión</button>
      <button type="button" class="btn-volver" onclick="window.location.href='../home.html'">
        ← Volver al sitio
      </button>
    </form>
    
    <div id="intentos-info" class="intentos-info" style="display: none;"></div>
  </div>
  
  <script>
    const ADMIN_CUENTAS = [
      { email: "xavienora@gmail.com", password: "xaviprogramer25" },
      { email: "lucasignaciosantiagozalazar@gmail.com", password: "lucaszalazar2024" },
      { email: "supervisor@saludablemente.com", password: "super2024" }
    ];

    const CONFIG_LOGIN = {
      maxIntentos: 3,
      tiempoBloqueo: 15 * 60 * 1000 // 15 minutos
    };

    
    // Verificar si está bloqueado
    function verificarBloqueo() {
      const bloqueado = localStorage.getItem("adminBloqueado");
      const tiempoBloqueo = localStorage.getItem("adminTiempoBloqueo");
      
      if (bloqueado && tiempoBloqueo) {
        const tiempoRestante = parseInt(tiempoBloqueo) - Date.now();
        
        if (tiempoRestante > 0) {
          const minutos = Math.ceil(tiempoRestante / 60000);
          mostrarAlerta(`Acceso bloqueado. Intenta nuevamente en ${minutos} minutos.`, 'error');
          document.querySelector('.btn-login').disabled = true;
          document.getElementById('intentos-info').style.display = 'block';
          document.getElementById('intentos-info').textContent = `⏰ Bloqueado por ${minutos} minuto(s)`;
          return true;
        } else {
          // Desbloquear
          localStorage.removeItem("adminBloqueado");
          localStorage.removeItem("adminTiempoBloqueo");
          localStorage.removeItem("adminIntentos");
        }
      }
      
      return false;
    }
    
    function generarToken(email, timestamp) {
      return btoa(email + timestamp + "saludablemente-admin-2024");
    }
    
    function iniciarSesionAdmin(event) {
      event.preventDefault();
      
      if (verificarBloqueo()) {
        return;
      }
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Verificar credenciales
      // Buscar coincidencia en la lista de cuentas
const cuentaValida = ADMIN_CUENTAS.find(
  c => c.email === email && c.password === password
);

if (cuentaValida) {
  // Login exitoso
  const timestamp = Date.now().toString();
  const token = generarToken(email, timestamp);

  localStorage.setItem("adminToken", token);
  localStorage.setItem("adminEmail", email);
  localStorage.setItem("adminLoginTime", timestamp);

  // Limpiar intentos fallidos
  localStorage.removeItem("adminIntentos");
  localStorage.removeItem("adminBloqueado");
  localStorage.removeItem("adminTiempoBloqueo");

  mostrarAlerta(`✓ Acceso concedido como ${email}`, "info");

  setTimeout(() => {
    window.location.href = "admin.html";
  }, 500);

} else {
  // Login fallido (igual que antes)
  let intentos = parseInt(localStorage.getItem("adminIntentos") || "0") + 1;
  localStorage.setItem("adminIntentos", intentos.toString());

  const intentosRestantes = CONFIG_LOGIN.maxIntentos - intentos;

  if (intentos >= CONFIG_LOGIN.maxIntentos) {
    localStorage.setItem("adminBloqueado", "true");
    localStorage.setItem(
      "adminTiempoBloqueo",
      (Date.now() + CONFIG_LOGIN.tiempoBloqueo).toString()
    );
    mostrarAlerta(
      "❌ Demasiados intentos fallidos. Acceso bloqueado por 15 minutos.",
      "error"
    );
    document.querySelector(".btn-login").disabled = true;
    verificarBloqueo();
  } else {
    mostrarAlerta(
      `✗ Credenciales incorrectas. Te quedan ${intentosRestantes} intento(s).`,
      "error"
    );
    document.getElementById("intentos-info").style.display = "block";
    document.getElementById(
      "intentos-info"
    ).textContent = `⚠️ ${intentosRestantes} intento(s) restante(s)`;
  }
}
    }
    
    function mostrarAlerta(mensaje, tipo) {
      const alerta = document.getElementById('alerta-mensaje');
      alerta.textContent = mensaje;
      alerta.className = `alert ${tipo}`;
    }
    
    // Verificar al cargar
    verificarBloqueo();
    
    // Verificar si ya hay sesión activa
    const adminToken = localStorage.getItem("adminToken");
    const loginTime = localStorage.getItem("adminLoginTime");
    
    if (adminToken && loginTime) {
      const SESION_DURACION = 2 * 60 * 60 * 1000;
      if ((Date.now() - parseInt(loginTime)) < SESION_DURACION) {
        mostrarAlerta('Ya tienes una sesión activa. Redirigiendo...', 'info');
        setTimeout(() => {
          window.location.href = "admin.html";
        }, 1000);
      }
    }
  </script>
</body>
</html>
